name: Release desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macos-14 dihentikan 2 November 2026 — migrasi ke macos-15 (audit temuan P1-04).
    # Xcode default pada macos-15: Xcode 16.x, SDK macOS 15.
    # Deployment target tetap macOS 13 (didefinisikan di Package.swift platforms: [.macOS(.v13)]).
    runs-on: macos-15
    permissions:
      contents: read
    # C5: secret dipetakan ke env di level job sehingga bisa dipakai di kondisi if: step
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: swift test
      - name: Build LGPL FFmpeg universal
        run: ./scripts/build-ffmpeg-universal.sh
      - name: Build universal macOS app
        env:
          CEYLORO_VERSION: ${{ github.ref_name }}
          CEYLORO_BUILD: ${{ github.run_number }}
        run: |
          # CATATAN: engine dokumen (LibreOffice + Pandoc) TIDAK dibundel secara default di CI
          # karena tidak tersedia di image runner macos-15. Build tetap menghasilkan .app yang
          # berfungsi — fitur konversi dokumen hanya tersembunyi dari UI, bukan error.
          #
          # Untuk mengaktifkan bundling engine dokumen pada release tertentu:
          # 1. Tambahkan langkah sebelum ini yang mengunduh dan menyiapkan engine ke sebuah
          #    direktori, misalnya ./document-engines-staging/
          # 2. Set env: CEYLORO_DOCUMENT_ENGINES_PATH=./document-engines-staging/
          #             CEYLORO_STAGE_DOCUMENT_ENGINES=1
          # 3. Pastikan SOURCE_ROOT dan DESTINATION berbeda (lihat stage-document-engines.sh)
          #
          # Jangan set CEYLORO_STAGE_DOCUMENT_ENGINES=1 tanpa langkah persiapan di atas —
          # build akan exit dengan error karena LibreOffice dan Pandoc tidak ditemukan.
          version="${CEYLORO_VERSION#v}"
          CEYLORO_VERSION="$version" CEYLORO_BUILD="$CEYLORO_BUILD" ./scripts/build-app.sh
      - name: Verify FFmpeg is bundled
        run: test -x Ceyloro.app/Contents/Resources/ffmpeg && ./scripts/verify-ffmpeg.sh Ceyloro.app/Contents/Resources/ffmpeg
      # C5: Signing dan notarization kondisional — hanya aktif jika secrets tersedia.
      # Secret yang diperlukan: APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID,
      # APPLE_NOTARIZE_APPLE_ID, APPLE_NOTARIZE_PASSWORD
      # Lihat docs/BUILD-SECRETS.md untuk cara mendapatkannya.
      - name: Sign macOS app (kondisional)
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          codesign --force --deep --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            Ceyloro.app
          echo "macOS app signed."
      - name: Notarize macOS app (kondisional)
        if: env.APPLE_NOTARIZE_APPLE_ID != ''
        run: |
          xcrun notarytool submit Ceyloro-macOS-universal.zip \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --wait
          xcrun stapler staple Ceyloro.app
          echo "macOS app notarized and stapled."
      - name: Package macOS app
        run: ditto --norsrc -c -k --keepParent Ceyloro.app Ceyloro-macOS-universal.zip
      - name: Create macOS package checksum
        run: shasum -a 256 Ceyloro-macOS-universal.zip | awk '{print $1"  "$2}' > Ceyloro-macOS-universal.zip.sha256
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-macOS-universal
          path: |
            Ceyloro-macOS-universal.zip
            Ceyloro-macOS-universal.zip.sha256

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    permissions:
      contents: read
    # C5: secret dipetakan ke env di level job sehingga bisa dipakai di kondisi if: step
    env:
      WINDOWS_SIGNING_CERT_PFX: ${{ secrets.WINDOWS_SIGNING_CERT_PFX }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Fetch and verify LGPL FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-windows.ps1 -Destination ffmpeg-package -Architecture ${{ matrix.architecture }}
      - name: Publish self-contained Windows app
        run: dotnet publish Windows/Ceyloro.Windows/Ceyloro.Windows.csproj --configuration Release --runtime win-${{ matrix.architecture }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      # C5: Authenticode signing kondisional — hanya aktif jika secret tersedia.
      # Secret yang diperlukan: WINDOWS_SIGNING_CERT_PFX (base64), WINDOWS_SIGNING_CERT_PASSWORD
      # Lihat docs/BUILD-SECRETS.md untuk cara mendapatkannya.
      - name: Sign Windows binary (kondisional)
        if: env.WINDOWS_SIGNING_CERT_PFX != ''
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX))
          signtool sign /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish/Ceyloro.exe
          Remove-Item $certPath -Force
          Write-Host "Windows binary signed."
      - name: Stage package contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Ceyloro | Out-Null
          Copy-Item publish/* package/Ceyloro/ -Recurse -Force
          Copy-Item ffmpeg-package/ffmpeg.exe package/Ceyloro/ffmpeg.exe -Force
          Copy-Item ffmpeg-package/ffprobe.exe package/Ceyloro/ffprobe.exe -Force
          Copy-Item ffmpeg-package/FFmpeg-LICENSE.txt package/Ceyloro/FFmpeg-LICENSE.txt -Force
          if (Test-Path document-engines) {
            Copy-Item document-engines package/Ceyloro/DocumentEngines -Recurse -Force
          }
          Copy-Item Windows/README.md package/Ceyloro/README.md -Force
      - name: Package Windows app & installer
        shell: pwsh
        run: |
          ./scripts/package-windows-installer.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-Windows-${{ matrix.architecture }}
          path: |
            dist/Ceyloro-Windows-${{ matrix.architecture }}*

  smoke-test:
    # C4: Smoke test paket release — unduh artifact macOS, verifikasi struktur dan konversi dasar.
    needs: [macos]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS package artifact
        uses: actions/download-artifact@v4
        with:
          name: Ceyloro-macOS-universal
          path: dist
      - name: Extract macOS package
        run: ditto -x -k dist/Ceyloro-macOS-universal.zip .
      - name: Verify app structure
        run: |
          test -x Ceyloro.app/Contents/MacOS/Ceyloro
          test -f Ceyloro.app/Contents/Info.plist
          test -x Ceyloro.app/Contents/Resources/ffmpeg
      - name: Verify bundled FFmpeg version
        run: ./scripts/verify-ffmpeg.sh Ceyloro.app/Contents/Resources/ffmpeg
      - name: Smoke test — PNG→JPEG conversion via FFmpeg
        run: |
          # Gunakan fixture gambar kecil yang sudah ada di repo
          Ceyloro.app/Contents/Resources/ffmpeg -y \
            -i fixtures/smoke-1x1.png \
            /tmp/smoke-output.jpg
          test -f /tmp/smoke-output.jpg && echo "Smoke test PNG→JPEG: PASS"
      - name: Smoke test — verify checksum file
        run: |
          (cd dist && shasum -a 256 -c Ceyloro-macOS-universal.zip.sha256) && echo "Checksum: PASS"

  release:
    needs: [macos, windows, smoke-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: Ceyloro-*
          path: dist
          merge-multiple: true
      # C5: Generate release manifest
      - name: Generate release manifest
        run: |
          RELEASE_TAG="$GITHUB_REF_NAME" bash scripts/generate-release-manifest.sh dist/ > dist/release-manifest.json
          echo "Release manifest:"
          cat dist/release-manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_files < <(find dist/ -maxdepth 1 -type f)
          release_args=("$GITHUB_REF_NAME" "${release_files[@]}" "--repo" "$GITHUB_REPOSITORY" "--title" "Ceyloro $GITHUB_REF_NAME" "--generate-notes" "--latest")
          case "$GITHUB_REF_NAME" in
            *-preview*|*-alpha*|*-beta*|*-rc*) release_args+=("--prerelease") ;;
          esac
          gh release create "${release_args[@]}"
